[package]
name = "kernels-metal"
version = "0.4.0"
edition = "2024"
authors = ["In Gim <in.gim@yale.edu>"]
description = "Metal kernel implementations (.metal shaders + PSO construction) and the signature table that declares them."
license = "Apache-2.0"
repository = "https://github.com/pie-project/pie"
publish = false

[lib]
name = "kernels_metal"
path = "src/lib.rs"

[features]
# See kernels-cuda: `native` builds `csrc/`, and is off so that reading the
# table costs nothing. `driver-metal` turns it on.
default = []
native = ["dep:cmake"]

[dependencies]
kernels = { path = "../kernels" }

[build-dependencies]
cmake = { version = "0.1", optional = true }
